<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedometer Solar Gold</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="hud engine-off" id="hud">

        <section class="cluster">
            <div class="glow"></div>
            <div class="glass"></div>
            <div class="honey"></div>

            <div class="ln t"></div>
            <div class="ln b"></div>
            <div class="sd l"></div>
            <div class="sd r"></div>

            <!-- garis merah peringatan seatbelt -->
            <div class="al t"></div>
            <div class="al b"></div>
            <div class="al l"></div>
            <div class="al r"></div>

            <div class="content" id="content">

                <div class="orn"><i></i><b></b><i></i></div>

                <!-- RPM -->
                <div class="rpm-label mini">RPM</div>
                <div class="rcol" id="rpmCol"></div>
                <div class="rpm-num" id="rpmNum">0.0k</div>

                <!-- kecepatan -->
                <div class="speed-box">
                    <div class="speed" id="speed">0</div>
                    <div class="unit" id="speedUnit">mph</div>
                </div>

                <!-- gear -->
                <div class="gear-label mini">Gear</div>
                <div class="gears" id="gears"></div>

                <!-- ikon status -->
                <div class="diamonds">
                    <div class="d" id="engine" title="Engine">
                        <svg viewBox="0 0 24 24"><path d="M5 9h2V7h3V5h4v2h2l2 2h2v7h-2l-2 2H9l-4-4z"/><path d="M2.5 10.5v4"/><path d="M12.6 9.6l-2.2 3h3l-2.2 3"/></svg>
                    </div>
                    <div class="d" id="seatbelts" title="Seatbelt">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M8 21l1.2-8.5C9.5 10.5 10.5 9.5 12 9.5s2.5 1 2.8 3L16 21"/><path d="M9.2 10.5l6.3 7"/><rect x="14.3" y="16.2" width="2.6" height="2.1" rx=".5"/></svg>
                    </div>
                    <div class="d" id="headlights" title="Lampu">
                        <svg viewBox="0 0 24 24">
                            <path d="M11 6c5.5 0 9 2.5 9 6s-3.5 6-9 6c-2.2 0-3.5-3-3.5-6s1.3-6 3.5-6z"/>
                            <g class="beam-low"><path d="M2.5 9.5l3.5 1.3M2.5 13l3.5 1.3M2.5 16.5l3.5 1.3"/></g>
                            <g class="beam-high"><path d="M2.5 9h3.5M2.5 12h3.5M2.5 15h3.5"/></g>
                        </svg>
                    </div>
                </div>

                <!-- fuel dan health -->
                <div class="cols">
                    <div class="pc" id="fuelCol">
                        <svg class="pi" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M4 21h10M14 9h2.5a1.5 1.5 0 0 1 1.5 1.5V16a1.5 1.5 0 0 0 3 0V8l-3-3M6.5 7h5"/></svg>
                        <div class="st" id="fuelPips"></div>
                        <b id="fuel">100%</b>
                    </div>
                    <div class="pc h" id="healthCol">
                        <svg class="pi" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.1 5.4L3.8 17.5a1.9 1.9 0 0 0 2.7 2.7l5.8-5.8a4 4 0 0 0 5.4-5.1l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>
                        <div class="st" id="healthPips"></div>
                        <b id="health">100%</b>
                    </div>
                </div>

                <div class="odo-box mini">Odo <em id="odoUnit">mi</em><b id="odometer">0000000</b></div>
            </div>

            <div class="scan"></div>

            <!-- animasi pembuka -->
            <div class="intro" id="intro">
                <div class="scanline"></div>
                <div class="rays"></div>
                <div class="intro-text">
                    <div class="welcome">Welcome,</div>
                    <div class="owner" id="owner">Mr. Montefalco</div>
                    <div class="divider"><i></i><b></b><i></i></div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
